{% extends 'base.html' %}
{% block title %}Gallery | Housewarming Party{% endblock %}
{% block content %}
  <section class="content-card">
    <p class="eyebrow">Gallery</p>
    <h1>A quiet album of cherished moments</h1>
    <div class="gallery-grid">
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=80" alt="Refined living room with graceful decor" />
        <figcaption>Warm welcome in the living room</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&fit=crop&w=900&q=80" alt="A beautiful dining space for gathering" />
        <figcaption>Dining space prepared for conversation</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=900&q=80" alt="A calm kitchen designed for hosting" />
        <figcaption>Kitchen ready for hospitality</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=900&q=80" alt="A serene and elegant garden setting" />
        <figcaption>Quiet garden moments</figcaption>
      </figure>
    </div>
  </section>
{% endblock %}
